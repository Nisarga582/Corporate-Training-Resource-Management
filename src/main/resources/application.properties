spring.application.name=Corporate Training Resource & Lab Infrastructure Management
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/corporate_training_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:dbpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.corporate.training=INFO
