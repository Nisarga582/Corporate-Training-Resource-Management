<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | TrainOps</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="login-body"><main class="login-card"><div class="brand-mark">T</div><p class="eyebrow">TRAINING OPERATIONS</p><h1>Welcome back</h1><p class="muted">Sign in to manage training infrastructure.</p><div th:if="${param.error}" class="alert">Invalid username or password.</div><div th:if="${param.logout}" class="success">You have been signed out.</div>
<form method="post" th:action="@{/login}"><label>Username<input name="username" required autofocus></label><label>Password<input name="password" type="password" required></label><button class="btn primary full">Sign in</button></form><p class="hint">Demo accounts are listed in README.md</p></main></body></html>
